<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#a42a45">
<script>try{var p=localStorage.getItem("cardival-theme")||"system";document.documentElement.dataset.theme=(p==="dark"||(p==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<title>Cardival – Make Every Moment Special</title>
<meta name="description" content="Create and share beautiful e-cards for birthdays, Eid, love, thanks and more.">
<style>
:root{--ink:#3b1a26;--mut:#7d5a66;--bg:#e9dccb;--pri:#a42a45;--pri2:#d7495f;--card:#f3e9dc;--r:18px;--line:#cfbfae;--hline:#d9c9b6;--hdr:rgba(233,220,203,.92);--g1:#eec0cb;--g2:#eed39a;color-scheme:light}
:root[data-theme=dark]{--ink:#fbeff3;--mut:#c9aab5;--bg:#1c1218;--card:#2a1b24;--line:#4d3543;--hline:#3a2631;--hdr:rgba(28,18,24,.92);--g1:rgba(164,42,69,.35);--g2:rgba(246,184,58,.12);--pri:#c93a5c;--pri2:#ef6f86;color-scheme:dark}
*{box-sizing:border-box}
body{transition:background .2s,color .2s;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:6px 5vw;border-bottom:1px solid var(--hline)}
.logo{font-weight:800;font-size:1.4rem;color:var(--pri);text-decoration:none}
.logo img{height:62px;width:auto;display:block}
body{position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;top:0;left:0;right:0;height:820px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 55% 70% at 12% 0%,var(--g1) 0,transparent 70%),radial-gradient(ellipse 50% 65% at 92% 5%,var(--g2) 0,transparent 70%)}
.hero h1{margin:0 0 6px}.herologo{width:min(560px,90vw);height:auto}
.dk{display:none!important}
:root[data-theme=dark] .dk{display:inline-block!important}
:root[data-theme=dark] .lt{display:none!important}
nav{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#themes{display:inline-flex;margin-left:14px;border:2px solid var(--line);border-radius:99px;overflow:hidden}
#themes button{border:0;background:transparent;cursor:pointer;padding:3px 9px;font-size:.95rem}
#themes button.on{background:var(--pri)}
nav a{margin-left:18px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
section{padding:48px 5vw;max-width:1100px;margin:auto}
.hero{text-align:center;padding-top:60px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 10px}
.hero p{color:var(--mut);font-size:1.15rem;margin:0 0 24px}
.btn{display:inline-block;border:0;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:12px 26px;border-radius:99px;font-weight:700;font-size:1rem;text-decoration:none}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.wa{background:#25d366}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.face{border-radius:var(--r);color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px;aspect-ratio:4/5;box-shadow:0 8px 24px rgba(60,30,90,.18)}
.face .em{font-size:3.4rem}
.face h3{margin:8px 0;font-size:1.25rem}
.face .to{font-weight:700;font-size:1.05rem}
.face .msg{font-size:.92rem;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.face .from{font-style:italic;font-size:.9rem}
.tile{background:var(--card);border-radius:var(--r);padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tile .face{box-shadow:none;aspect-ratio:1/1;padding:12px}
.tile .face .em{font-size:2.6rem}
.tile button{width:100%;margin-top:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:720px){.editor{grid-template-columns:1fr}nav a{margin-left:10px}}
label{display:block;font-weight:700;margin:12px 0 4px}
input,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hide{display:none}
.note{color:var(--mut);font-size:.9rem}
footer{text-align:center;color:var(--mut);padding:30px;font-size:.9rem}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <a class="logo" href="#" id="logo"><img class="lt" src="/cardival-logo-light.png?v=8" alt="Cardival – Make every moment special"><img class="dk" src="/cardival-logo-dark.png?v=8" alt="Cardival – Make every moment special"></a>
  <nav><a href="#gallery" data-go="gallery">Cards</a><a href="#contact" data-go="contact">Contact</a>
    <div id="themes" role="group" aria-label="Theme"><button data-t="light" title="Light mode" aria-label="Light mode">☀️</button><button data-t="dark" title="Dark mode" aria-label="Dark mode">🌙</button><button data-t="system" title="Match my device" aria-label="System mode">🖥️</button></div></nav>
</header>

<section class="hero" id="home">
  <h1><img class="herologo lt" src="/cardival-logo-light.png?v=8" alt="Cardival – Make every moment special"><img class="herologo dk" src="/cardival-logo-dark.png?v=8" alt="Cardival – Make every moment special"></h1>
  <p>Pick a card, add your words, and send it in seconds.</p>
  <button class="btn" data-go="gallery">Explore Cards</button>
  <div class="row" id="previews"></div>
</section>

<section id="gallery">
  <h2>Card Gallery</h2>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</section>

<section id="editor" class="hide">
  <h2>Personalize your card</h2>
  <div class="editor">
    <div>
      <label for="to">Recipient's name</label><input id="to" maxlength="40" placeholder="e.g. Rahim">
      <label for="from">Your name</label><input id="from" maxlength="40" placeholder="e.g. Nila">
      <label for="msg">Your message</label><textarea id="msg" maxlength="240"></textarea>
      <div class="actions">
        <button class="btn" id="dl">⬇ Download image</button>
        <button class="btn wa" id="wa">WhatsApp</button>
        <button class="btn alt" id="copy">🔗 Copy link</button>
      </div>
      <p class="note">The link holds your card inside it, so no account is needed.</p>
    </div>
    <div id="preview"></div>
  </div>
</section>

<section id="viewer" class="hide" style="max-width:420px;text-align:center">
  <div id="shared"></div>
  <div class="actions" style="justify-content:center"><button class="btn" data-go="gallery">Make your own card</button></div>
</section>

<section id="contact">
  <h2>Contact &amp; feedback</h2>
  <p>Something not working, or want a feature? Tell us.</p>
  <div class="actions"><a class="btn wa" id="contactWa" target="_blank" rel="noopener">Chat on WhatsApp</a></div>
  <label for="fb">What should we build next?</label>
  <textarea id="fb" placeholder="More Eid cards, photo upload, Bangla fonts..."></textarea>
  <div class="actions"><button class="btn" id="sendFb">Send feedback</button></div>
</section>
<footer>© <span id="yr"></span> Cardival · Made with love</footer>
<div id="toast"></div>

<script>
// ===== SETTINGS: change these =====
const WHATSAPP_NUMBER = "8801XXXXXXXXX"; // your number, country code first, no + or spaces
const FEEDBACK_URL = "/api/feedback"; // later: your backend endpoint (POST JSON). Empty = send via WhatsApp

// ===== CARD DATA =====
const CATS = ["Birthday","Love","Friendship","Thank you","Congrats","Eid & Festivals"];
const CARDS = [
 {id:1,c:"Birthday",e:"🎂",t:"Happy Birthday!",g:["#ff9a5a","#e0447c"],m:"Wishing you a day full of joy, cake and laughter."},
 {id:2,c:"Birthday",e:"🎈",t:"Another Year Brighter",g:["#36d1dc","#5b86e5"],m:"May this year bring everything you dream of."},
 {id:3,c:"Birthday",e:"🎁",t:"Party Time!",g:["#f7971e","#ffd200"],m:"Eat, laugh and celebrate. You deserve it!"},
 {id:4,c:"Love",e:"❤️",t:"Happy Anniversary",g:["#ee0979","#ff6a00"],m:"Every day with you is my favorite day."},
 {id:5,c:"Love",e:"💞",t:"You Are My World",g:["#b24592","#f15f79"],m:"Thank you for loving me the way you do."},
 {id:6,c:"Love",e:"🌹",t:"Forever Yours",g:["#c31432","#240b36"],m:"Still choosing you, always."},
 {id:7,c:"Friendship",e:"🤝",t:"Best Friends",g:["#11998e","#38ef7d"],m:"Life is better with a friend like you."},
 {id:8,c:"Friendship",e:"🌈",t:"Thinking of You",g:["#7f7fd5","#86a8e7"],m:"Just a little note to say you matter to me."},
 {id:9,c:"Friendship",e:"😄",t:"Stay Awesome",g:["#fc5c7d","#6a82fb"],m:"Never change. The world needs your smile."},
 {id:10,c:"Thank you",e:"🙏",t:"Thank You",g:["#614385","#516395"],m:"I truly appreciate everything you did."},
 {id:11,c:"Thank you",e:"🌸",t:"With Gratitude",g:["#d66d75","#e29587"],m:"Your kindness made a real difference."},
 {id:12,c:"Thank you",e:"☕",t:"You Rock!",g:["#8e5a3c","#c79a6b"],m:"Thanks a million. Coffee is on me!"},
 {id:13,c:"Congrats",e:"🎉",t:"Congratulations!",g:["#f953c6","#b91d73"],m:"So proud of you. You earned every bit of it."},
 {id:14,c:"Congrats",e:"🎓",t:"Well Done, Graduate",g:["#1d976c","#0b6b4d"],m:"Hard work pays off. Go change the world!"},
 {id:15,c:"Congrats",e:"🏆",t:"You Did It!",g:["#f2994a","#f2c94c"],m:"Celebrating your big win with you."},
 {id:16,c:"Eid & Festivals",e:"🌙",t:"Eid Mubarak",g:["#0f2027","#2c7a6b"],m:"May Allah accept your prayers and fill your home with joy."},
 {id:17,c:"Eid & Festivals",e:"🕌",t:"Ramadan Kareem",g:["#134e5e","#71b280"],m:"Wishing you a blessed and peaceful month."},
 {id:18,c:"Eid & Festivals",e:"🪔",t:"Happy Festival",g:["#ff512f","#dd2476"],m:"May your days glow with light, love and happiness."}
];

// ===== HELPERS =====
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grad = c => `linear-gradient(135deg,${c.g[0]},${c.g[1]})`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function face(c,d){
  d=d||{};
  return `<div class="face" style="background:${grad(c)}"><div class="em">${c.e}</div><h3>${esc(c.t)}</h3>`+
   (d.to?`<div class="to">Dear ${esc(d.to)},</div>`:"")+
   (d.m?`<div class="msg">${esc(d.m)}</div>`:"")+
   (d.from?`<div class="from">— ${esc(d.from)}</div>`:"")+`</div>`;
}
function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(t){try{t=t.replace(/-/g,"+").replace(/_/g,"/");const s=atob(t),b=Uint8Array.from(s,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))}catch(e){return null}}

// ===== STATE / VIEWS =====
let cur=null, cat="All";
function show(name){
  ["home","gallery","editor","viewer","contact"].forEach(id=>{
    const el=$("#"+id);
    const visible = name==="viewer" ? id==="viewer"
      : name==="editor" ? id==="editor"
      : (id==="home"||id==="gallery"||id==="contact");
    el.classList.toggle("hide",!visible);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
function go(where){
  if(where==="gallery"||where==="contact"){show("home");setTimeout(()=>$("#"+where).scrollIntoView({behavior:"smooth"}),30)}
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}});
$("#logo").onclick=e=>{e.preventDefault();history.replaceState(null,"","/");show("home")};

// ===== GALLERY =====
function drawGallery(){
  $("#filters").innerHTML=["All",...CATS].map(c=>`<button class="chip ${c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  $("#grid").innerHTML=CARDS.filter(c=>cat==="All"||c.c===cat).map(c=>
   `<div class="tile">${face(c)}<button class="btn" data-id="${c.id}">Personalize</button></div>`).join("");
}
$("#filters").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;drawGallery()}};
$("#grid").onclick=e=>{const b=e.target.closest("[data-id]");if(b)openEditor(+b.dataset.id)};
$("#previews").innerHTML=[1,4,16].map(i=>`<div style="width:190px">${face(CARDS[i-1])}</div>`).join("");

// ===== EDITOR =====
function data(){return {to:$("#to").value.trim(),from:$("#from").value.trim(),m:$("#msg").value.trim()}}
function drawPreview(){$("#preview").innerHTML=face(cur,data())}
function openEditor(id){
  cur=CARDS.find(c=>c.id===id);
  $("#to").value="";$("#from").value="";$("#msg").value=cur.m;
  drawPreview();show("editor");
}
["to","from","msg"].forEach(i=>$("#"+i).addEventListener("input",drawPreview));
function longLink(){const d=data();return location.origin+location.pathname+"#c."+enc({i:cur.id,t:d.to,f:d.from,m:d.m})}
async function link(){
  const d=data();
  try{
    const r=await fetch("/api/cards",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({i:cur.id,t:d.to,f:d.from,m:d.m})});
    if(!r.ok)throw 0;const j=await r.json();return location.origin+"/c/"+j.id;
  }catch(e){return longLink()}
}
function plainText(){const d=data();return `${cur.e} ${cur.t}\n${d.to?"Dear "+d.to+",\n":""}${d.m}\n${d.from?"— "+d.from:""}`}

$("#copy").onclick=async()=>{
  const l=await link();
  try{await navigator.clipboard.writeText(l);toast("Link copied!")}
  catch(e){prompt("Copy this link:",l)}
};
$("#wa").onclick=async()=>{
  const w=window.open("","_blank"),l=await link(),u="https://wa.me/?text="+encodeURIComponent(plainText()+"\n\n"+l);
  if(w)w.location=u;else location.href=u;
};
$("#dl").onclick=async()=>{
  const d=data(),W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d"),gr=x.createLinearGradient(0,0,W,H);gr.addColorStop(0,cur.g[0]);gr.addColorStop(1,cur.g[1]);
  x.fillStyle=gr;x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="center";
  x.font="220px serif";x.fillText(cur.e,W/2,330);
  x.font="bold 78px system-ui,sans-serif";x.fillText(cur.t,W/2,500);
  let y=620;
  if(d.to){x.font="bold 54px system-ui,sans-serif";x.fillText("Dear "+d.to+",",W/2,y);y+=90}
  x.font="46px system-ui,sans-serif";
  const lines=[];
  d.m.split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{const t=l?l+" "+w:w;if(x.measureText(t).width>880&&l){lines.push(l);l=w}else l=t});lines.push(l)});
  lines.slice(0,7).forEach(l=>{x.fillText(l,W/2,y);y+=66});
  if(d.from){x.font="italic 48px system-ui,sans-serif";x.fillText("— "+d.from,W/2,y+50)}
  x.globalAlpha=1;
  try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src="/cardival-logo.png?v=7"});
    const lw=360,lh=lw*im.height/im.width,lx=(W-lw)/2,ly=H-lh-40;
    x.save();x.beginPath();if(x.roundRect)x.roundRect(lx,ly,lw,lh,26);else x.rect(lx,ly,lw,lh);x.clip();x.drawImage(im,lx,ly,lw,lh);x.restore()}
  catch(e){x.font="34px system-ui,sans-serif";x.fillText("Made with Cardival",W/2,H-60)}
  const a=document.createElement("a");a.download="cardival-card.png";a.href=cv.toDataURL("image/png");a.click();
  toast("Downloading...");
};

// ===== SHARED CARD VIEW =====
function route(){
  const m=location.pathname.match(/^\/c\/([\w-]+)$/);
  if(m){
    fetch("/api/cards/"+m[1]).then(r=>r.ok?r.json():Promise.reject()).then(o=>{
      const c=CARDS.find(c=>c.id===o.i);
      if(c){$("#shared").innerHTML=face(c,{to:o.t,from:o.f,m:o.m});show("viewer")}
    }).catch(()=>toast("Card not found"));
    return;
  }
  const h=location.hash;
  if(h.startsWith("#c.")){
    const o=dec(h.slice(3)),c=o&&CARDS.find(c=>c.id===o.i);
    if(c){$("#shared").innerHTML=face(c,{to:o.t,from:o.f,m:o.m});show("viewer");return}
  }
}
window.addEventListener("hashchange",route);

// ===== CONTACT / FEEDBACK =====
$("#contactWa").href="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent("Hi Cardival!");
$("#sendFb").onclick=async()=>{
  const t=$("#fb").value.trim();if(!t){toast("Please write something first");return}
  if(FEEDBACK_URL){
    try{const r=await fetch(FEEDBACK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({feedback:t})});if(!r.ok)throw 0;$("#fb").value="";toast("Thank you!");return}
    catch(e){}
  }
  window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent("Cardival feedback: "+t),"_blank");
};
// ===== THEME (light / dark / system) =====
const mq=matchMedia("(prefers-color-scheme: dark)");
function themePref(){try{return localStorage.getItem("cardival-theme")||"system"}catch(e){return"system"}}
function applyTheme(){
  const p=themePref(),dark=p==="dark"||(p==="system"&&mq.matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.querySelectorAll("#themes button").forEach(b=>{const on=b.dataset.t===p;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
}
$("#themes").onclick=e=>{const b=e.target.closest("button");if(!b)return;try{localStorage.setItem("cardival-theme",b.dataset.t)}catch(x){}applyTheme()};
mq.addEventListener("change",applyTheme);
applyTheme();
$("#yr").textContent=new Date().getFullYear();
drawGallery();show("home");route();
</script>
</body>
</html>
